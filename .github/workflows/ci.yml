name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0-23/3 * * *"

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Should build?
        id: should_build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A manual run is an explicit request to rebuild every enabled app.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run: forcing a full build."
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git checkout origin/update -- build.md; then
            echo "No previous build record; starting the first build."
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! UPDATE_CFG=$(./build.sh config.toml --config-update); then
            echo "::error::Could not check patch updates."
            exit 1
          fi

          if [[ -n "$UPDATE_CFG" ]]; then
            echo "New patch version detected; building affected apps."
            printf '%s\\n' "$UPDATE_CFG" > config.json
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
          else
            echo "No patch changes; skipping automatic build."
            echo "SHOULD_BUILD=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

    outputs:
      SHOULD_BUILD: ${{ steps.should_build.outputs.SHOULD_BUILD }}

  build:
    permissions: write-all
    needs: check
    uses: ./.github/workflows/build.yml
    if: ${{ needs.check.outputs.SHOULD_BUILD == 1 }}
    with:
      # Automatic runs build only apps affected by a new patch.
      # Manual runs bypass the patch filter and rebuild all enabled apps.
      from_ci: ${{ github.event_name != 'workflow_dispatch' }}
    secrets: inherit
