name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Restore signing keystore
        env:
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MORPHE_KEYSTORE_BASE64"
          printf '%s' "$MORPHE_KEYSTORE_BASE64" | base64 --decode > Morphe.keystore
          chmod 600 Morphe.keystore

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "'$UPDATE_CFG'"
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next version code and date-based release tag
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Keep the APK/module versionCode numeric and independent from release tags.
          LAST_NUMERIC_TAG=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^[0-9]+$")) | tonumber] | max // 0')
          echo "NEXT_VER_CODE=$((LAST_NUMERIC_TAG + 1))" >> "$GITHUB_OUTPUT"

          # Use Ukraine local date. First release of the day has no suffix;
          # subsequent releases use -1, -2, -3, ...
          BASE_TAG=$(TZ=Europe/Kyiv date +%d-%m-%Y)
          if ! gh release view "$BASE_TAG" >/dev/null 2>&1; then
            RELEASE_TAG="$BASE_TAG"
          else
            LAST_SUFFIX=$(gh release list --limit 100 --json tagName | jq -r --arg base "$BASE_TAG" '[.[].tagName | select(test("^" + $base + "-[0-9]+$")) | capture("^" + $base + "-(?<n>[0-9]+)$").n | tonumber] | max // 0')
            RELEASE_TAG="$BASE_TAG-$((LAST_SUFFIX + 1))"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Start API Solver in background
        run: docker run -d -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest

      - name: Build modules/APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          PYTHONUNBUFFERED: 1
          UPDATE_REPO_PAT: ${{ secrets.UPDATE_REPO_PAT }}
        run: |
          if [ -f "config.json" ]; then 
            stdbuf -o0 bash ./build.sh config.json
          else 
            stdbuf -o0 bash ./build.sh config.toml
          fi

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp
      
      - name: Upload release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.RELEASE_TAG }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          set -euo pipefail
          ls -lh ./build/*
          RELEASE_TITLE=""
          while IFS='|' read -r APP_NAME BRAND PATCH_SOURCE PATCH_VERSION; do
            [ -n "$APP_NAME" ] || continue
            [ -n "$BRAND" ] || BRAND="Morphe"
            PATCH_SOURCE="${PATCH_SOURCE#github:}"
            PATCH_SOURCE="${PATCH_SOURCE#gitlab:}"
            PATCH_SOURCE="${PATCH_SOURCE%%,*}"
            if [ -z "$PATCH_VERSION" ] || [ "$PATCH_VERSION" = "latest" ]; then
              PATCH_VERSION=$(gh api "repos/$PATCH_SOURCE/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            elif [ "$PATCH_VERSION" = "dev" ]; then
              PATCH_VERSION=$(gh api "repos/$PATCH_SOURCE/releases" --jq '.[0].tag_name' 2>/dev/null || true)
            fi
            PATCH_VERSION="${PATCH_VERSION#v}"
            [ -n "$PATCH_VERSION" ] || PATCH_VERSION="unknown"
            APP_TITLE="$APP_NAME ($BRAND $PATCH_VERSION)"
            if [ -n "$RELEASE_TITLE" ]; then
              RELEASE_TITLE="$RELEASE_TITLE x $APP_TITLE"
            else
              RELEASE_TITLE="$APP_TITLE"
            fi
          done < <(
            if [ -f config.json ]; then
              jq -r '
                . as $root |
                ($root["patches-version"] // "latest") as $global_pv |
                to_entries[] |
                select(.value | type == "object") |
                select(.value.enabled != false) |
                [(.value["app-name"] // .key), (.value["rv-brand"] // "Morphe"), (.value["patches-source"] // "github:MorpheApp/morphe-patches"), (.value["patches-version"] // $global_pv)] |
                @tsv | gsub("\\t"; "|")
              ' config.json
            else
              awk '
                BEGIN { global_pv="latest" }
                /^[[:space:]]*patches-version[[:space:]]*=/ && section == "" {
                  v=$0; sub(/^[^"]*"/,"",v); sub(/".*$/,"",v); global_pv=v
                }
                /^\\[[^]]+\\][[:space:]]*$/ {
                  if (section != "" && enabled == "true" && app != "") print app "|" brand "|" source "|" (pv != "" ? pv : global_pv)
                  section=1; enabled=""; app=""; brand=""; source=""; pv=""; next
                }
                section && /^[[:space:]]*enabled[[:space:]]*=/ {
                  if ($0 ~ /=[[:space:]]*true([[:space:]]*(#.*)?$)/) enabled="true"
                }
                section && /^[[:space:]]*app-name[[:space:]]*=/ { app=$0; sub(/^[^"]*"/,"",app); sub(/".*$/,"",app) }
                section && /^[[:space:]]*rv-brand[[:space:]]*=/ { brand=$0; sub(/^[^"]*"/,"",brand); sub(/".*$/,"",brand) }
                section && /^[[:space:]]*patches-source[[:space:]]*=/ { source=$0; sub(/^[^"]*"/,"",source); sub(/".*$/,"",source) }
                section && /^[[:space:]]*patches-version[[:space:]]*=/ { pv=$0; sub(/^[^"]*"/,"",pv); sub(/".*$/,"",pv) }
                END { if (section != "" && enabled == "true" && app != "") print app "|" brand "|" source "|" (pv != "" ? pv : global_pv) }
              ' config.toml
            fi
          )
          [ -n "$RELEASE_TITLE" ] || RELEASE_TITLE="Morphe build"
          RELEASE_TITLE="$RELEASE_TITLE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$RELEASE_TITLE" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "$RELEASE_TITLE" --notes "$BODY"
          fi
      - name: Update modules changelog and update json
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.RELEASE_TAG }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md *-update.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi
