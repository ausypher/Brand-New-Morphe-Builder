 <path d="M20-105l-73 105h47l-18 105 79-119H8z" fill="url(#bolt)" stroke="#d9fbff" stroke-width="2" stroke-linejoin="round"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="92" y="177" fill="#8cecff" font-size="18" font-weight="700" letter-spacing="6">ANDROID PATCH BUILD SYSTEM</text>
 <text x="88" y="260" fill="url(#word)" font-size="76" font-weight="800" letter-spacing="-3">MORPHE BLDR</text>
 <text x="94" y="310" fill="#c1cde5" font-size="23" font-weight="400" letter-spacing=".6">One workflow. Multiple patch sources. Your builds.</text>
 <g transform="translate(95 350)" font-size="13" font-weight="700" letter-spacing="1.4">
  <rect width="118" height="34" rx="17" fill="#17344a" stroke="#4edcff" stroke-opacity=".55"/><text x="59" y="22" fill="#a7efff" text-anchor="middle">AUTOMATED</text>
  <rect x="132" width="92" height="34" rx="17" fill="#24284b" stroke="#a78bfa" stroke-opacity=".65"/><text x="178" y="22" fill="#d5c7ff" text-anchor="middle">MODULAR</text>
  <rect x="238" width="112" height="34" rx="17" fill="#17344a" stroke="#4edcff" stroke-opacity=".55"/><text x="294" y="22" fill="#a7efff" text-anchor="middle">OPEN SOURCE</text>
 </g>
