<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Morphe BLDR</title>
<desc id="desc">A dark futuristic banner with a glowing electric bolt, circuit paths and the Morphe BLDR wordmark.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset=".55" stop-color="#101a35"/><stop offset="1" stop-color="#21113d"/></linearGradient>
  <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8df7ff"/><stop offset=".48" stop-color="#36c8ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f5fbff"/><stop offset=".65" stop-color="#a9dfff"/><stop offset="1" stop-color="#c4a7ff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#3bcfff" stop-opacity=".28"/><stop offset="1" stop-color="#3bcfff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#9ccaff" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)"/>
<circle cx="900" cy="210" r="300" fill="url(#glow)"/>
<circle cx="900" cy="210" r="150" fill="#5b43a8" opacity=".13" filter="url(#blur)"/>
<g fill="none" stroke="#62dfff" stroke-opacity=".28" stroke-width="2">
 <path d="M0 82H180l32 32h110M0 330h220l34-34h100M1200 90h-150l-30 30H900M1200 330h-190l-30-30H900"/>
 <path d="M80 0v52l28 28h70M1100 0v48l-30 30h-55M90 420v-44l28-28h90M1080 420v-54l-28-28h-78"/>
</g>
<g fill="#6fe7ff" opacity=".8"><circle cx="322" cy="114" r="4"/><circle cx="354" cy="328" r="4"/><circle cx="900" cy="120" r="4"/><circle cx="900" cy="300" r="4"/><circle cx="1080" cy="78" r="4"/></g>
<g transform="translate(825 210)">
 <circle r="128" fill="#2fcfff" opacity=".12" filter="url(#blur)"/>
 <circle r="104" fill="none" stroke="#73e6ff" stroke-opacity=".35" stroke-width="2"/>
 <circle r="84" fill="none" stroke="#b39aff" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="5 10"/>
